# CI do VitrineIQ: testes da API (pytest), do front (tsc + Vitest + build + headers), smoke E2E/WCAG e Docker.
# shortcut: computer-vision/ fica de fora (Python 3.14 + Ultralytics/torch pesados); incluir se a câmera ganhar testes sem o modelo.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  frontend:
    name: Front (tsc + Vitest + build + headers)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Type-check TypeScript
        run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
      - name: Verificar ausência de scripts inline em dist/index.html
        run: |
          test -f dist/index.html
          ! grep -q "<script[^>]*>[^<]" dist/index.html
      - name: Verificar cabeçalhos obrigatórios em frontend/vercel.json
        run: |
          node -e '
            const fs = require("node:fs");
            const cfg = JSON.parse(fs.readFileSync("vercel.json", "utf8"));
            const required = [
              "X-Content-Type-Options",
              "X-Frame-Options",
              "Referrer-Policy",
              "Permissions-Policy",
              "Strict-Transport-Security",
              "Content-Security-Policy",
            ];
            const keys = new Set(
              (cfg.headers || []).flatMap((rule) => (rule.headers || []).map((h) => h.key))
            );
            const missing = required.filter((k) => !keys.has(k));
            if (missing.length > 0) {
              console.error("Cabeçalhos obrigatórios ausentes em vercel.json:", missing);
              process.exit(1);
            }
          '

  e2e:
    name: E2E Smoke & WCAG (Playwright)
    needs: [api, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements*.txt
      - run: pip install -r api/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - name: Build do front apontando para API local
        env:
          VITE_API_URL: http://127.0.0.1:8000
        run: npm --prefix frontend run build
      - name: Instalar Playwright Chromium e axe-core (fora do package.json)
        run: |
          mkdir -p /tmp/pw
          npm install --prefix /tmp/pw --no-save playwright axe-core
          /tmp/pw/node_modules/.bin/playwright install chromium --with-deps
      - name: Subir API + Vite Preview e executar e2e-smoke.mjs
        env:
          AUTH_SECRET: ci-e2e-smoke-secret-key-min-32-chars!!
          ADMIN_USUARIO: admin-ci
          ADMIN_SENHA: AdminCiSmoke#2026
          VITRINE_TOKEN: ci-vitrine-token-smoke
          BASE_URL: http://127.0.0.1:4173
          API_URL: http://127.0.0.1:8000
          E2E_USER: admin-ci
          E2E_PASS: AdminCiSmoke#2026
          PLAYWRIGHT_PATH: /tmp/pw/node_modules/playwright/index.mjs
        run: |
          set -euo pipefail
          python -m uvicorn app.main:app --app-dir api --host 127.0.0.1 --port 8000 >/tmp/api.log 2>&1 &
          API_PID=$!
          npm --prefix frontend run preview -- --host 127.0.0.1 --port 4173 --strictPort >/tmp/preview.log 2>&1 &
          PREVIEW_PID=$!
          cleanup() {
            kill "$API_PID" "$PREVIEW_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/health >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/api/health >/dev/null

          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173 >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4173 >/dev/null

          node frontend/scripts/e2e-smoke.mjs

  docker:
    name: Docker (build das imagens)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
