# VitrineIQ com Docker: cp .env.example .env && docker compose up --build
# Front em http://localhost:8080 (repassa /api para a API); API direta em http://localhost:8000 (câmera no host).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vitrineiq
      POSTGRES_USER: vitrineiq
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vitrineiq}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vitrineiq -d vitrineiq"]
      interval: 3s
      retries: 20

  api:
    build: ./api
    environment:
      DATABASE_URL: postgresql://vitrineiq:${POSTGRES_PASSWORD:-vitrineiq}@db:5432/vitrineiq
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      AUTH_SECRET: ${AUTH_SECRET:-}
      ADMIN_USUARIO: ${ADMIN_USUARIO:-}
      ADMIN_SENHA: ${ADMIN_SENHA:-}
      VITRINE_TOKEN: ${VITRINE_TOKEN:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8080,http://localhost:3000}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - api

volumes:
  pgdata:
